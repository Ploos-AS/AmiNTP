name: M0/M1 qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static platform contract
        run: make check
      - name: Host compile and CLI smoke
        run: make host-check
      - name: M1.1 SNTP wire tests
        run: make m1-check
