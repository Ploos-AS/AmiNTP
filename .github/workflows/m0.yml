name: M0/M1/M2/M3 qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static platform contract
        run: make check
      - name: Host compile and CLI smoke
        run: make host-check
      - name: M1 qualification
        run: make m1.3-check
      - name: M2 qualification
        run: make m2.3-check
      - name: M3.1 ARexx foundation
        run: make m3.1-check
