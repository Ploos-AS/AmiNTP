name: M0/M1/M2/M3/M4 qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static platform contract
        run: make check
      - name: Host compile and CLI smoke
        run: make host-check
      - name: M1 qualification
        run: make m1.3-check
      - name: M2.1 time conversion
        run: make m2.1-check
      - name: M2.2 system clock logic
        run: make m2.2-check
      - name: M2.3 RTC logic
        run: make m2.3-check
      - name: M3.2 ARexx commands
        run: make m3.2-check
      - name: M4.1 configuration and startup
        run: make m4.1-check
