name: FS-UAE AROS qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aros-runtime-gates:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install FS-UAE runtime tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fs-uae xvfb curl lhasa file p7zip-full

      - name: Validate M3.3a harness
        run: make m3.3a-check

      - name: Validate M3.3b native-build harness
        run: make m3.3b-check

      - name: Validate M3.3c guest-execution harness
        run: make m3.3c-check

      - name: Gate 1 - internal AROS Kickstart smoke
        run: ci/fs-uae/run-aros-smoke.sh

      - name: Gate 2 - AROS boot-floppy smoke
        run: ci/fs-uae/run-aros-media-smoke.sh

      - name: Gate 3 - native Bebbo AmiNTP build
        run: ci/fs-uae/build-native.sh

      - name: Gate 4 - execute AmiNTP inside AROS guest
        run: ci/fs-uae/run-aros-guest-smoke.sh

      - name: Upload FS-UAE qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fs-uae-aros-qualification
          path: |
            build/fs-uae/aros-boot/result.txt
            build/fs-uae/aros-boot/source.txt
            build/fs-uae/aros-boot/archive.sha256
            build/fs-uae/aros-boot/fs-uae.log
            build/fs-uae/aros-boot/fs-uae-version.txt
            build/fs-uae/native/AmiNTP
            build/fs-uae/native/AmiNTP.sha256
            build/fs-uae/native/file.txt
            build/fs-uae/native/result.txt
            build/fs-uae/native/toolchain-image.txt
            build/fs-uae/aros-system/source.txt
            build/fs-uae/aros-system/archive.sha256
            build/fs-uae/aros-guest/result.txt
            build/fs-uae/aros-guest/fs-uae.log
            build/fs-uae/aros-guest/fs-uae-version.txt
            build/fs-uae/aros-guest/aros-guest.fs-uae
          if-no-files-found: warn
